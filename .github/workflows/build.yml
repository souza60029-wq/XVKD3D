name: Build XVKD3D (ESX)

on:
  workflow_dispatch:
    inputs:
      xvkd3d_version:
        description: 'XVKD3D version (e.g. 0.5)'
        required: false
        default: '0.5'
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/build.yml'
      - 'wcp-profile.json'

env:
  UPSTREAM_REPO: https://github.com/HansKristian-Work/vkd3d-proton.git
  UPSTREAM_TAG: v3.0.1
  PATCH_FILE: patches/esx-xclipse-v4.patch

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout XVKD3D
        uses: actions/checkout@v4

      - name: Validate patch file exists
        run: |
          test -f "$PATCH_FILE" || { echo "Missing $PATCH_FILE"; exit 1; }
          test -f wcp-profile.json || { echo "Missing wcp-profile.json"; exit 1; }

      - name: Install Arch MinGW build dependencies
        run: |
          printf '\n\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n\n' >> /etc/pacman.conf
          pacman-key --init
          pacman -Sy --needed --noconfirm archlinux-keyring
          pacman -Syu --needed --noconfirm \
            clang meson glslang git mingw-w64 wine base base-devel \
            sed tar curl wget bash gzip sudo file gawk grep bzip2 which \
            findutils diffutils coreutils procps-ng util-linux \
            xcb-util xcb-util-keysyms xcb-util-wm lib32-libxcb lib32-xcb-util-keysyms

      - name: Clone upstream and apply ESX patch
        run: |
          git clone --recursive --branch "$UPSTREAM_TAG" "$UPSTREAM_REPO" vkd3d-proton
          cd vkd3d-proton
          git apply --check ../"$PATCH_FILE"
          git apply ../"$PATCH_FILE"
          git diff --stat

      - name: Build (mingw, x64 + x86)
        run: |
          cd vkd3d-proton
          ./package-release.sh esx ../out --no-package
          ls -R ../out | head -40

      - name: Package WCP
        run: |
          XV="${{ inputs.xvkd3d_version || '0.5' }}"
          test -f "wcp-profile.version" && XV="$(cat wcp-profile.version)"
          ls -R out | head -40
          mkdir -p wcp/system32 wcp/syswow64
          cp out/vkd3d-proton-esx/x64/d3d12.dll out/vkd3d-proton-esx/x64/d3d12core.dll wcp/system32/
          cp out/vkd3d-proton-esx/x86/d3d12.dll out/vkd3d-proton-esx/x86/d3d12core.dll wcp/syswow64/
          sed "s/__XVKD3D_VERSION__/$XV/g" wcp-profile.json > wcp/profile.json
          cat wcp/profile.json
          tar -C wcp -cJf "XVKD3D-$XV-3.0.1.wcp" .
          sha256sum "XVKD3D-$XV-3.0.1.wcp" wcp/system32/* wcp/syswow64/* | tee sha256.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: XVKD3D-${{ inputs.xvkd3d_version || '0.5' }}
          path: |
            XVKD3D-*.wcp
            sha256.txt
