          # esx_bcn_cache.c — SHA256-keyed disk cache
          cat > esx_bcn_cache.c << 'CACHE_EOF'
          /*
           * ESX BCn disk cache — SHA256-keyed raw pixel cache.
           *
           * Cache path (in order):
           *   $VKD3D_BCN_CACHE_PATH/
           *   $XDG_CACHE_HOME/vkd3d/bcn_cache/
           *   ~/.cache/vkd3d/bcn_cache/
           *
           * Key: lowercase hex SHA256 of compressed texture bytes.
           * Value: raw decoded pixel bytes (size determined from mip dimensions).
           * Cache writes are async via POSIX threads.
           */

          #define VKD3D_DBG_CHANNEL VKD3D_DBG_CHANNEL_API
          #include "esx_bcn_decode.h"
          #include "vkd3d_private.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <errno.h>
          #ifdef _WIN32
          #include <direct.h>
          #define esx_mkdir(path, mode) _mkdir(path)
          #else
          #include <sys/stat.h>
          #include <unistd.h>
          #define esx_mkdir(path, mode) mkdir(path, mode)
          #endif

          /* ── Minimal SHA256 (public domain / RFC 6234 based) ─────────────────────── */
          typedef struct { uint32_t h[8]; uint64_t len; uint8_t buf[64]; int buflen; } sha256_ctx;

          static void sha256_init(sha256_ctx *c) {
              c->h[0]=0x6a09e667u; c->h[1]=0xbb67ae85u; c->h[2]=0x3c6ef372u; c->h[3]=0xa54ff53au;
              c->h[4]=0x510e527fu; c->h[5]=0x9b05688cu; c->h[6]=0x1f83d9abu; c->h[7]=0x5be0cd19u;
              c->len=0; c->buflen=0;
          }
          static uint32_t rotr32(uint32_t x,int n){return(x>>n)|(x<<(32-n));}
          static void sha256_process_block(sha256_ctx *c, const uint8_t *blk) {
              static const uint32_t K[64]={
                  0x428a2f98u,0x71374491u,0xb5c0fbefu,0xe9b5dba5u,0x3956c25bu,0x59f111f1u,0x923f82a4u,0xab1c5ed5u,
                  0xd807aa98u,0x12835b01u,0x243185beu,0x550c7dc3u,0x72be5d74u,0x80deb1feu,0x9bdc06a7u,0xc19bf174u,
                  0xe49b69c1u,0xefbe4786u,0x0fc19dc6u,0x240ca1ccu,0x2de92c6fu,0x4a7484aau,0x5cb0a9dcu,0x76f988dau,
                  0x983e5152u,0xa831c66du,0xb00327c8u,0xbf597fc7u,0xc6e00bf3u,0xd5a79147u,0x06ca6351u,0x14292967u,
                  0x27b70a85u,0x2e1b2138u,0x4d2c6dfcu,0x53380d13u,0x650a7354u,0x766a0abbu,0x81c2c92eu,0x92722c85u,
                  0xa2bfe8a1u,0xa81a664bu,0xc24b8b70u,0xc76c51a3u,0xd192e819u,0xd6990624u,0xf40e3585u,0x106aa070u,
                  0x19a4c116u,0x1e376c08u,0x2748774cu,0x34b0bcb5u,0x391c0cb3u,0x4ed8aa4au,0x5b9cca4fu,0x682e6ff3u,
                  0x748f82eeu,0x78a5636fu,0x84c87814u,0x8cc70208u,0x90befffau,0xa4506cebu,0xbef9a3f7u,0xc67178f2u};
              uint32_t w[64],a,b,d,e,f,g,h,s0,s1,t1,t2;
              for(int i=0;i<16;i++) w[i]=((uint32_t)blk[i*4]<<24)|((uint32_t)blk[i*4+1]<<16)|((uint32_t)blk[i*4+2]<<8)|blk[i*4+3];
              for(int i=16;i<64;i++){s0=rotr32(w[i-15],7)^rotr32(w[i-15],18)^(w[i-15]>>3);s1=rotr32(w[i-2],17)^rotr32(w[i-2],19)^(w[i-2]>>10);w[i]=w[i-16]+s0+w[i-7]+s1;}
              a=c->h[0];b=c->h[1];uint32_t cc=c->h[2];d=c->h[3];e=c->h[4];f=c->h[5];g=c->h[6];h=c->h[7];
              for(int i=0;i<64;i++){s1=rotr32(e,6)^rotr32(e,11)^rotr32(e,25);t1=h+s1+((e&f)^(~e&g))+K[i]+w[i];s0=rotr32(a,2)^rotr32(a,13)^rotr32(a,22);t2=s0+((a&b)^(a&cc)^(b&cc));h=g;g=f;f=e;e=d+t1;d=cc;cc=b;b=a;a=t1+t2;}
              c->h[0]+=a;c->h[1]+=b;c->h[2]+=cc;c->h[3]+=d;c->h[4]+=e;c->h[5]+=f;c->h[6]+=g;c->h[7]+=h;
          }
          static void sha256_update(sha256_ctx *c, const void *data, size_t len) {
              const uint8_t *p=data; c->len+=len;
              while(len>0){int n=(int)len<64-c->buflen?(int)len:64-c->buflen;memcpy(c->buf+c->buflen,p,n);c->buflen+=n;p+=n;len-=n;if(c->buflen==64){sha256_process_block(c,c->buf);c->buflen=0;}}
          }
          static void sha256_final(sha256_ctx *c, uint8_t out[32]) {
              uint8_t pad[64]={0};pad[0]=0x80;int used=c->buflen;uint64_t bits=c->len*8;
              int pad_len=(used<56)?56-used:120-used;sha256_update(c,pad,pad_len);
              uint8_t len_bytes[8];for(int i=7;i>=0;i--){len_bytes[i]=(uint8_t)bits;bits>>=8;}sha256_update(c,len_bytes,8);
              for(int i=0;i<8;i++){out[i*4]=(uint8_t)(c->h[i]>>24);out[i*4+1]=(uint8_t)(c->h[i]>>16);out[i*4+2]=(uint8_t)(c->h[i]>>8);out[i*4+3]=(uint8_t)c->h[i];}
          }

          static void compute_sha256_hex(const void *data, size_t len, char hex[65]) {
              sha256_ctx ctx; sha256_init(&ctx); sha256_update(&ctx,data,len);
              uint8_t digest[32]; sha256_final(&ctx,digest);
              for(int i=0;i<32;i++) snprintf(hex+i*2,3,"%02x",digest[i]);
              hex[64]='\0';
          }

          static void get_cache_dir(char *buf, size_t bufsz) {
              const char *env=getenv("VKD3D_BCN_CACHE_PATH");
              if(env&&env[0]){snprintf(buf,bufsz,"%s",env);return;}
              env=getenv("XDG_CACHE_HOME");
              if(env&&env[0]){snprintf(buf,bufsz,"%s/vkd3d/bcn_cache",env);return;}
              const char *home=getenv("HOME");
              snprintf(buf,bufsz,"%s/.cache/vkd3d/bcn_cache",home?home:"/tmp");
          }

          static void mkdir_p(const char *path) {
              char tmp[512]; snprintf(tmp,sizeof(tmp),"%s",path);
              for(char *p=tmp+1;*p;p++){if(*p=='/'){*p='\0';esx_mkdir(tmp,0755);*p='/';}}
              esx_esx_mkdir(tmp,0755);
          }

          bool esx_bcn_cache_lookup(const void *compressed, size_t compressed_size,
                           void **out_data, size_t *out_size) {
              char hex[65]; compute_sha256_hex(compressed,compressed_size,hex);
              char dir[512]; get_cache_dir(dir,sizeof(dir));
              char path[640]; snprintf(path,sizeof(path),"%s/%s",dir,hex);
              FILE *f=fopen(path,"rb"); if(!f)return false;
              fseek(f,0,SEEK_END); long sz=ftell(f); rewind(f);
              if(sz<=0){fclose(f);return false;}
              void *buf=malloc((size_t)sz); if(!buf){fclose(f);return false;}
              if(fread(buf,1,(size_t)sz,f)!=(size_t)sz){free(buf);fclose(f);return false;}
              fclose(f);
              *out_data=buf; *out_size=(size_t)sz;
              INFO("ESX BCn cache HIT: %s (%zu bytes)\n",hex,(size_t)sz);
              return true;
          }

          typedef struct { void *comp; size_t comp_sz; void *dec; size_t dec_sz; } cache_write_args;
          static void *cache_write_thread(void *arg) {
              cache_write_args *a=arg;
              char hex[65]; compute_sha256_hex(a->comp,a->comp_sz,hex);
              char dir[512]; get_cache_dir(dir,sizeof(dir));
              mkdir_p(dir);
              char tmp[640],final[640];
              snprintf(tmp,sizeof(tmp),"%s/%s.tmp",dir,hex);
              snprintf(final,sizeof(final),"%s/%s",dir,hex);
              FILE *f=fopen(tmp,"wb");
              if(f){fwrite(a->dec,1,a->dec_sz,f);fclose(f);rename(tmp,final);
          INFO("ESX BCn cache WRITE: %s (%zu bytes)\n",hex,a->dec_sz);}
              free(a->comp); free(a->dec); free(a); return NULL;
          }

          void esx_bcn_cache_store_async(const void *compressed, size_t compressed_size,
                                const void *decoded, size_t decoded_size) {
              cache_write_args *a=malloc(sizeof(*a)); if(!a)return;
              a->comp=malloc(compressed_size); a->dec=malloc(decoded_size);
              if(!a->comp||!a->dec){free(a->comp);free(a->dec);free(a);return;}
              memcpy(a->comp,compressed,compressed_size);
              memcpy(a->dec,decoded,decoded_size);
              a->comp_sz=compressed_size; a->dec_sz=decoded_size;
              pthread_t t;
              /* VKD3D supplies the cross-platform pthread abstraction; keep the write asynchronous. */
              pthread_create(&t,NULL,cache_write_thread,a);
          }

          bool esx_bcn_needs_decode(const struct d3d12_device *device, DXGI_FORMAT fmt) {
              if(device->device_info.properties2.properties.vendorID != 0x144d) return false;
              switch(fmt){
              case DXGI_FORMAT_BC4_TYPELESS: case DXGI_FORMAT_BC4_UNORM: case DXGI_FORMAT_BC4_SNORM:
              case DXGI_FORMAT_BC5_TYPELESS: case DXGI_FORMAT_BC5_UNORM: case DXGI_FORMAT_BC5_SNORM:
              case DXGI_FORMAT_BC6H_TYPELESS: case DXGI_FORMAT_BC6H_UF16: case DXGI_FORMAT_BC6H_SF16:
              case DXGI_FORMAT_BC7_TYPELESS: case DXGI_FORMAT_BC7_UNORM: case DXGI_FORMAT_BC7_UNORM_SRGB:
                  return true;
              default: return false;
              }
          }

          VkFormat esx_bcn_target_vkformat(DXGI_FORMAT fmt) {
              switch(fmt){
              case DXGI_FORMAT_BC4_TYPELESS: case DXGI_FORMAT_BC4_UNORM: return VK_FORMAT_R8_UNORM;
              case DXGI_FORMAT_BC4_SNORM: return VK_FORMAT_R8_SNORM;
              case DXGI_FORMAT_BC5_TYPELESS: case DXGI_FORMAT_BC5_UNORM: return VK_FORMAT_R8G8_UNORM;
              case DXGI_FORMAT_BC5_SNORM: return VK_FORMAT_R8G8_SNORM;
              case DXGI_FORMAT_BC6H_TYPELESS: case DXGI_FORMAT_BC6H_UF16: case DXGI_FORMAT_BC6H_SF16:
                  return getenv("VKD3D_BCN_BC6H_RGBA16F") ? VK_FORMAT_R16G16B16A16_SFLOAT : VK_FORMAT_E5B9G9R9_UFLOAT_PACK32;
              case DXGI_FORMAT_BC7_TYPELESS: case DXGI_FORMAT_BC7_UNORM: return VK_FORMAT_R8G8B8A8_UNORM;
              case DXGI_FORMAT_BC7_UNORM_SRGB: return VK_FORMAT_R8G8B8A8_SRGB;
              default: return VK_FORMAT_UNDEFINED;
              }
          }
          CACHE_EOF

      # ── Step 4: Compile SPIR-V shaders ───────────────────────────────────
      - name: Compile SPIR-V
        run: |
          for s in shaders/esx_bc4_decode.comp shaders/esx_bc5_decode.comp \
                   shaders/esx_bc7_decode.comp shaders/esx_bc6h_decode.comp; do
            glslangValidator -V "$s" -o "${s%.comp}.spv"
            echo "Compiled: $s → ${s%.comp}.spv ($(wc -c < ${s%.comp}.spv) bytes)"
          done

      # ── Step 5: Apply patch + inject sources ──────────────────────────────
      - name: Apply patch and inject sources
        run: |
          cd vkd3d-proton

          # Apply patch (format table + swapchain + RT + resource.c)
          git apply --check ../esx_v4.patch
          git apply --whitespace=fix ../esx_v4.patch

          # Inject new source files
          cp ../esx_bcn_decode.h  libs/vkd3d/esx_bcn_decode.h
          cp ../esx_bcn_cache.c   libs/vkd3d/esx_bcn_cache.c

          # Create SPIR-V header directory and embed SPIR-V as C arrays
          mkdir -p libs/vkd3d/generated
          for shader in bc4_decode bc5_decode bc7_decode bc6h_decode; do
            spv="../shaders/esx_${shader}.spv"
            out="libs/vkd3d/generated/esx_${shader}_spv.h"
            echo "/* Auto-generated SPIR-V for esx_${shader} */" > "$out"
            echo "static const uint32_t esx_${shader}_spv[] = {" >> "$out"
            python3 -c "
          import struct, sys
          data = open('$spv','rb').read()
          # pad to 4-byte boundary
          while len(data)%4: data+=b'\x00'
          words = struct.unpack('<'+'I'*(len(data)//4), data)
          print(','.join(hex(w) for w in words))
          " >> "$out"
            echo "};" >> "$out"
            echo "static const uint32_t esx_${shader}_spv_size = sizeof(esx_${shader}_spv);" >> "$out"
            echo "Embedded SPIR-V: $shader ($(wc -l < $out) lines)"
          done

          # Register new .c files in meson.build
          for f in esx_bcn_cache.c; do
            if ! grep -q "$f" libs/vkd3d/meson.build; then
              sed -i "/'utils.c',/a\\    '$f'," libs/vkd3d/meson.build
              echo "Registered $f in meson.build"
            fi
          done

          # Add generated/ include path to meson.build
          if ! grep -q "generated" libs/vkd3d/meson.build; then
            sed -i "/'libs\/vkd3d'/a\\    'libs/vkd3d/generated'," libs/vkd3d/meson.build || true
          fi

          git diff --stat

      # ── Step 6: Build ─────────────────────────────────────────────────────
      - name: Build (x64 + x86)
        run: |
          cd vkd3d-proton
          ./package-release.sh esx ../out --no-package

      # ── Step 7: Write profile.json ────────────────────────────────────────
      - name: Write profile.json
        run: |
          cat > profile.json << 'PROFILE_EOF'
          {
            "type": "VKD3D",
            "name": "XVKD3D",
            "versionName": "XVKD3D V4",
            "versionCode": 400,
            "description": "XVKD3D V4 — VKD3D-Proton 3.0.1. Xclipse 940 fixes: GPU compute BCn decode (BC4→R8, BC5→RG8, BC7→RGBA8, BC6H→RGB9E5/RGBA16F), disk cache, ESX RT library fix, CMA swapchain device wait.",
            "files": [
              { "source": "system32/d3d12.dll",     "target": "${system32}/d3d12.dll" },
              { "source": "system32/d3d12core.dll", "target": "${system32}/d3d12core.dll" },
              { "source": "syswow64/d3d12.dll",     "target": "${syswow64}/d3d12.dll" },
              { "source": "syswow64/d3d12core.dll", "target": "${syswow64}/d3d12core.dll" }
            ]
          }
          PROFILE_EOF

      # ── Step 8: Package WCP ───────────────────────────────────────────────
      - name: Package as WCP
        run: |
          ls -R out/ | head -30
          mkdir -p wcp/system32 wcp/syswow64
          cp out/vkd3d-proton-esx/x64/d3d12.dll     wcp/system32/
          cp out/vkd3d-proton-esx/x64/d3d12core.dll wcp/system32/
          cp out/vkd3d-proton-esx/x86/d3d12.dll     wcp/syswow64/
          cp out/vkd3d-proton-esx/x86/d3d12core.dll wcp/syswow64/
          cp profile.json wcp/
          tar -C wcp -cJf XVKD3D-V4-3.0.1.wcp .
          sha256sum XVKD3D-V4-3.0.1.wcp wcp/system32/* wcp/syswow64/* | tee sha256.txt
          echo "--- WCP size ---"
          du -h XVKD3D-V4-3.0.1.wcp

      # ── Step 9: Upload ────────────────────────────────────────────────────
      - name: Upload XVKD3D V4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: XVKD3D-V4
          path: |
            XVKD3D-V4-3.0.1.wcp
            sha256.txt

  # ── Second job: Umbra-VK V4 (same patches, different profile name) ────────
  build-umbra:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    needs: build
    steps:
      - name: Download XVKD3D V4 WCP
        uses: actions/download-artifact@v4
        with:
          name: XVKD3D-V4

      - name: Repackage as Umbra-VK V4
        run: |
          # Umbra-VK is the same DLLs, different profile metadata
          mkdir -p xvkd3d_extracted
          tar -xJf XVKD3D-V4-3.0.1.wcp -C xvkd3d_extracted

          # Replace profile.json with Umbra-VK identity
          cat > xvkd3d_extracted/profile.json << 'UMBRA_PROFILE_EOF'
          {
            "type": "VKD3D",
            "name": "Umbra-VK",
            "versionName": "Umbra-VK V4",
            "versionCode": 400,
            "description": "Umbra-VK V4 — VKD3D-Proton 3.0.1. Xclipse 940 silicon BCn fix via GPU compute decode + persistent disk cache. BC4→R8, BC5→RG8, BC7→RGBA8, BC6H→RGB9E5 (default) / RGBA16F (VKD3D_BCN_BC6H_RGBA16F=1). ESX RT fix. CMA swapchain device wait.",
            "files": [
              { "source": "system32/d3d12.dll",     "target": "${system32}/d3d12.dll" },
              { "source": "system32/d3d12core.dll", "target": "${system32}/d3d12core.dll" },
              { "source": "syswow64/d3d12.dll",     "target": "${syswow64}/d3d12.dll" },
              { "source": "syswow64/d3d12core.dll", "target": "${syswow64}/d3d12core.dll" }
            ]
          }
          UMBRA_PROFILE_EOF

          tar -C xvkd3d_extracted -cJf Umbra-VK-V4-3.0.1.wcp .
          sha256sum Umbra-VK-V4-3.0.1.wcp | tee umbra_sha256.txt
          du -h Umbra-VK-V4-3.0.1.wcp

      - name: Upload Umbra-VK V4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-VK-V4
          path: |
            Umbra-VK-V4-3.0.1.wcp
            umbra_sha256.txt
