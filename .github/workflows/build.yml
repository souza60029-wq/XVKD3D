name: Build XVKD3D V4 + Umbra-VK V4 (ESX + BCn GPU compute)
# XVKD3D V4 / Umbra-VK V4 — VKD3D-Proton 3.0.1
# Xclipse 940 (vendorID=0x144d) BCn fix via GPU compute shader decode:
#   BC4  → R8    (1 B/px, GPU decode)
#   BC5  → RG8   (2 B/px, GPU decode)
#   BC7  → RGBA8 (4 B/px, GPU decode)
#   BC6H → RGB9E5 default / RGBA16F via VKD3D_BCN_BC6H_RGBA16F=1
# Decode runs once per texture (GPU-parallel), result cached to disk.
# Also includes: ESX RT fix + CMA swapchain device wait.
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          printf '\n\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n\n' >> /etc/pacman.conf
          pacman-key --init
          pacman -Sy --needed --noconfirm archlinux-keyring
          pacman -Syu --needed --noconfirm \
            clang meson glslang git mingw-w64 wine \
            base base-devel sed tar gzip findutils coreutils diffutils python

      - name: Clone VKD3D-Proton v3.0.1
        run: |
          git clone --recursive --branch v3.0.1 \
            https://github.com/HansKristian-Work/vkd3d-proton.git vkd3d-proton

      # ── Step 1: Write the unified diff patch ──────────────────────────────
      - name: Write ESX V4 patch
        run: |
          cat > esx_v4.patch << 'PATCH_EOF'
          diff --git a/include/vkd3d.h b/include/vkd3d.h
          index bc77c8cd..f7515b8d 100644
          --- a/include/vkd3d.h
          +++ b/include/vkd3d.h
          @@ -120,6 +120,12 @@ extern "C" {
           #define VKD3D_CONFIG_FLAG_DEFER_RESOURCE_DESTRUCTION (1ull << 60)
           #define VKD3D_CONFIG_FLAG_PREFER_THIN_UAV_TILING (1ull << 61)
           #define VKD3D_CONFIG_FLAG_EXTENDED_DEBUG_UTILS (1ull << 62)
          +/* ESX: Samsung Xclipse 940 (vendorID=0x144d) workarounds */
          +#define VKD3D_CONFIG_FLAG_ESX_NO_RT_LIBRARIES       (1ull << 63)
          +#define VKD3D_CONFIG_FLAG_ESX_SWAPCHAIN_DEVICE_WAIT (1ull << 59)
          +/* ESX: decode BC4-BC7 via GPU compute on first upload, cache result to disk.
          + * Xclipse 940 silicon: BC4-BC7 optimalTilingFeatures=0 (hardware-level, confirmed). */
          +#define VKD3D_CONFIG_FLAG_ESX_BCN_GPU_DECODE        (1ull << 58)
           
           struct vkd3d_instance;
           
          diff --git a/libs/vkd3d/device.c b/libs/vkd3d/device.c
          index 63a82c33..3c93361d 100644
          --- a/libs/vkd3d/device.c
          +++ b/libs/vkd3d/device.c
          @@ -1255,6 +1255,9 @@ static const struct vkd3d_debug_option vkd3d_config_options[] =
               {"dxr", VKD3D_CONFIG_FLAG_DXR},
               {"dxr12", VKD3D_CONFIG_FLAG_DXR_1_2},
               {"nodxr", VKD3D_CONFIG_FLAG_NO_DXR},
          +    {"esx_no_rt_libraries",       VKD3D_CONFIG_FLAG_ESX_NO_RT_LIBRARIES},
          +    {"esx_swapchain_device_wait", VKD3D_CONFIG_FLAG_ESX_SWAPCHAIN_DEVICE_WAIT},
          +    {"esx_bcn_gpu_decode",        VKD3D_CONFIG_FLAG_ESX_BCN_GPU_DECODE},
               {"single_queue", VKD3D_CONFIG_FLAG_SINGLE_QUEUE},
               {"descriptor_qa_checks", VKD3D_CONFIG_FLAG_DESCRIPTOR_QA_CHECKS},
               {"no_upload_hvv", VKD3D_CONFIG_FLAG_NO_UPLOAD_HVV},
          diff --git a/libs/vkd3d/raytracing_pipeline.c b/libs/vkd3d/raytracing_pipeline.c
          index 353a5d69..3fa99140 100644
          --- a/libs/vkd3d/raytracing_pipeline.c
          +++ b/libs/vkd3d/raytracing_pipeline.c
          @@ -2661,6 +2661,23 @@ static HRESULT d3d12_state_object_init(struct d3d12_rt_state_object *object,
               if (FAILED(hr = d3d12_state_object_pipeline_data_find_global_state_objects(&data,
                       &object->shader_config, &object->pipeline_config)))
                   goto fail;
          +    INFO("ESX: CreateStateObject type=%u flags=%#x subobjects=%u\n",
          +            (unsigned int)desc->Type, (unsigned int)object->flags,
          +            (unsigned int)desc->NumSubobjects);
          +
          +    if (vkd3d_esx_no_rt_libraries(device))
          +    {
          +        if (object->flags & D3D12_STATE_OBJECT_FLAG_ALLOW_STATE_OBJECT_ADDITIONS)
          +        {
          +            INFO("ESX: stripping ALLOW_STATE_OBJECT_ADDITIONS (no RT pipeline libraries).\n");
          +            object->flags &= ~D3D12_STATE_OBJECT_FLAG_ALLOW_STATE_OBJECT_ADDITIONS;
          +        }
          +        if (object->type == D3D12_STATE_OBJECT_TYPE_COLLECTION)
          +        {
          +            INFO("ESX: deferring COLLECTION (no RT pipeline libraries).\n");
          +            goto fail;
          +        }
          +    }
           
               /* Figure out how many variants we need. We'll need one pipeline variant
                * for every unique global root signature. */
          diff --git a/libs/vkd3d/resource.c b/libs/vkd3d/resource.c
          index 0fa8fb1e..1d106b8f 100644
          --- a/libs/vkd3d/resource.c
          +++ b/libs/vkd3d/resource.c
          @@ -3041,8 +3041,11 @@ static HRESULT d3d12_resource_validate_usage(const D3D12_RESOURCE_DESC1 *desc,
               if (desc->Dimension != D3D12_RESOURCE_DIMENSION_BUFFER &&
                       (total_flags & required_image_flags) != required_image_flags)
               {
          -        WARN("Requested resource flags #%x, but no format in cast list supports it.\n",
          -                desc->Flags);
          +        WARN("Requested resource flags #%x, but no format supports it. "
          +                "ESX: DXGI=%#x VkFmt=%d required=%#x available=%#x\n",
          +                desc->Flags, (unsigned int)desc->Format,
          +                format ? (int)format->vk_format : -1,
          +                (unsigned int)required_image_flags, (unsigned int)total_flags);
                   return E_INVALIDARG;
               }
           
          diff --git a/libs/vkd3d/swapchain.c b/libs/vkd3d/swapchain.c
          index 8dd2cc10..a9cf8ab8 100644
          --- a/libs/vkd3d/swapchain.c
          +++ b/libs/vkd3d/swapchain.c
          @@ -1688,6 +1688,16 @@ static void dxgi_vk_swap_chain_destroy_swapchain_in_present_task(struct dxgi_vk_
               }
               else
               {
          +        bool is_samsung = chain->queue->device->device_info.properties2.properties.vendorID == 0x144d;
          +        if (is_samsung || (vkd3d_config_flags & VKD3D_CONFIG_FLAG_ESX_SWAPCHAIN_DEVICE_WAIT))
          +        {
          +            /* ESX: Xclipse holds CMA-backed EGL buffers in driver-internal contexts beyond
          +             * present queue. Full device idle required to release CMA.
          +             * Without this: EGL mtrack 48MB->112MB, CmaFree->0, LMKD kills at ~91% RAM. */
          +            INFO("ESX: vkDeviceWaitIdle before swapchain destroy (vendorID=%#x)\n",
          +                    chain->queue->device->device_info.properties2.properties.vendorID);
          +            VK_CALL(vkDeviceWaitIdle(chain->queue->device->vk_device));
          +        }
                   /* Best effort workaround. */
                   vk_queue = vkd3d_queue_acquire(chain->queue->vkd3d_queue);
                   VK_CALL(vkQueueWaitIdle(vk_queue));
          diff --git a/libs/vkd3d/utils.c b/libs/vkd3d/utils.c
          index 49109071..8cb00113 100644
          --- a/libs/vkd3d/utils.c
          +++ b/libs/vkd3d/utils.c
          @@ -122,18 +122,22 @@ static const struct vkd3d_format vkd3d_formats[] =
               {DXGI_FORMAT_BC3_TYPELESS,          VK_FORMAT_BC3_UNORM_BLOCK,          1,  4, 4, 16, COLOR, 1, TYPELESS},
               {DXGI_FORMAT_BC3_UNORM,             VK_FORMAT_BC3_UNORM_BLOCK,          1,  4, 4, 16, COLOR, 1},
               {DXGI_FORMAT_BC3_UNORM_SRGB,        VK_FORMAT_BC3_SRGB_BLOCK,           1,  4, 4, 16, COLOR, 1},
          -    {DXGI_FORMAT_BC4_TYPELESS,          VK_FORMAT_BC4_UNORM_BLOCK,          1,  4, 4,  8, COLOR, 1, TYPELESS},
          -    {DXGI_FORMAT_BC4_UNORM,             VK_FORMAT_BC4_UNORM_BLOCK,          1,  4, 4,  8, COLOR, 1},
          -    {DXGI_FORMAT_BC4_SNORM,             VK_FORMAT_BC4_SNORM_BLOCK,          1,  4, 4,  8, COLOR, 1},
          -    {DXGI_FORMAT_BC5_TYPELESS,          VK_FORMAT_BC5_UNORM_BLOCK,          1,  4, 4, 16, COLOR, 1, TYPELESS},
          -    {DXGI_FORMAT_BC5_UNORM,             VK_FORMAT_BC5_UNORM_BLOCK,          1,  4, 4, 16, COLOR, 1},
          -    {DXGI_FORMAT_BC5_SNORM,             VK_FORMAT_BC5_SNORM_BLOCK,          1,  4, 4, 16, COLOR, 1},
          -    {DXGI_FORMAT_BC6H_TYPELESS,         VK_FORMAT_BC6H_UFLOAT_BLOCK,        1,  4, 4, 16, COLOR, 1, TYPELESS},
          -    {DXGI_FORMAT_BC6H_UF16,             VK_FORMAT_BC6H_UFLOAT_BLOCK,        1,  4, 4, 16, COLOR, 1},
          -    {DXGI_FORMAT_BC6H_SF16,             VK_FORMAT_BC6H_SFLOAT_BLOCK,        1,  4, 4, 16, COLOR, 1},
          -    {DXGI_FORMAT_BC7_TYPELESS,          VK_FORMAT_BC7_UNORM_BLOCK,          1,  4, 4, 16, COLOR, 1, TYPELESS},
          -    {DXGI_FORMAT_BC7_UNORM,             VK_FORMAT_BC7_UNORM_BLOCK,          1,  4, 4, 16, COLOR, 1},
          -    {DXGI_FORMAT_BC7_UNORM_SRGB,        VK_FORMAT_BC7_SRGB_BLOCK,           1,  4, 4, 16, COLOR, 1},
          +    /* ESX: Xclipse 940 (vendorID=0x144d) BC4-BC7 optimalTilingFeatures=0 (silicon-level).
          +     * Remap to uncompressed targets; GPU compute shader decodes on first upload, cached to disk.
          +     * BC4->R8 (1B/px), BC5->RG8 (2B/px), BC7->RGBA8 (4B/px), BC6H->RGB9E5/RGBA16F (4/8B/px). */
          +    {DXGI_FORMAT_BC4_TYPELESS,          VK_FORMAT_R8_UNORM,                 1,  1, 1,  1, COLOR, 1, TYPELESS},
          +    {DXGI_FORMAT_BC4_UNORM,             VK_FORMAT_R8_UNORM,                 1,  1, 1,  1, COLOR, 1},
          +    {DXGI_FORMAT_BC4_SNORM,             VK_FORMAT_R8_SNORM,                 1,  1, 1,  1, COLOR, 1},
          +    {DXGI_FORMAT_BC5_TYPELESS,          VK_FORMAT_R8G8_UNORM,               2,  1, 1,  1, COLOR, 1, TYPELESS},
          +    {DXGI_FORMAT_BC5_UNORM,             VK_FORMAT_R8G8_UNORM,               2,  1, 1,  1, COLOR, 1},
          +    {DXGI_FORMAT_BC5_SNORM,             VK_FORMAT_R8G8_SNORM,               2,  1, 1,  1, COLOR, 1},
          +    /* BC6H: RGB9E5 by default (4B/px); VKD3D_BCN_BC6H_RGBA16F=1 -> RGBA16F (8B/px) */
          +    {DXGI_FORMAT_BC6H_TYPELESS,         VK_FORMAT_E5B9G9R9_UFLOAT_PACK32,   4,  1, 1,  1, COLOR, 1, TYPELESS},
          +    {DXGI_FORMAT_BC6H_UF16,             VK_FORMAT_E5B9G9R9_UFLOAT_PACK32,   4,  1, 1,  1, COLOR, 1},
          +    {DXGI_FORMAT_BC6H_SF16,             VK_FORMAT_E5B9G9R9_UFLOAT_PACK32,   4,  1, 1,  1, COLOR, 1},
          +    {DXGI_FORMAT_BC7_TYPELESS,          VK_FORMAT_R8G8B8A8_UNORM,           4,  1, 1,  1, COLOR, 1, TYPELESS},
          +    {DXGI_FORMAT_BC7_UNORM,             VK_FORMAT_R8G8B8A8_UNORM,           4,  1, 1,  1, COLOR, 1},
          +    {DXGI_FORMAT_BC7_UNORM_SRGB,        VK_FORMAT_R8G8B8A8_SRGB,             4,  1, 1,  1, COLOR, 1},
               {DXGI_FORMAT_B4G4R4A4_UNORM,        VK_FORMAT_A4R4G4B4_UNORM_PACK16,    2,  1, 1,  1, COLOR, 1},
               {DXGI_FORMAT_A4B4G4R4_UNORM,        VK_FORMAT_R4G4B4A4_UNORM_PACK16,    2,  1, 1,  1, COLOR, 1},
           
          PATCH_EOF

      # ── Step 2: Write GLSL compute shaders ───────────────────────────────
      - name: Write BCn compute shaders
        run: |
          mkdir -p shaders

          # BC4 decode → R8
          cat > shaders/esx_bc4_decode.comp << 'GLSL_EOF'
          #version 450
          // ESX BC4→R8 decode compute shader
          // Xclipse 940: BC4 not supported in silicon; decode via GPU compute, cache to disk.
          // Each workgroup handles one 8×8 pixel tile (covering 4 BC4 blocks of 4×4 each).
          // Each invocation decodes one pixel.
          layout(local_size_x = 8, local_size_y = 8, local_size_z = 1) in;

          layout(set = 0, binding = 0, std430) readonly buffer SrcBuffer {
              uint data[];
          } src;

          layout(set = 0, binding = 1, r8) uniform writeonly image2D dstImage;

          layout(push_constant) uniform PushConstants {
              uint srcOffsetDwords; // byte offset into src buffer / 4
              uint mipWidth;
              uint mipHeight;
              uint snorm; // 1 = signed, 0 = unsigned
          } pc;

          // Decode one BC4 block (8 bytes) for pixel (px, py) within the block.
          // block_data: two uint32s covering the 8 bytes of the block.
          float decode_bc4_pixel(uint lo, uint hi, int px, int py, bool snorm) {
              // Endpoints from bytes 0 and 1
              uint e0_raw = lo & 0xFFu;
              uint e1_raw = (lo >> 8) & 0xFFu;

              float e0, e1;
              if (snorm) {
                  e0 = (e0_raw == 0u) ? -1.0 : float(int(e0_raw) - 128) / 127.0;
                  e1 = (e1_raw == 0u) ? -1.0 : float(int(e1_raw) - 128) / 127.0;
              } else {
                  e0 = float(e0_raw) / 255.0;
                  e1 = float(e1_raw) / 255.0;
              }

              // 6-entry index palette
              float pal[8];
              pal[0] = e0; pal[1] = e1;
              if (!snorm && e0 > e1) {
                  pal[2] = (6.0*e0 + 1.0*e1) / 7.0;
                  pal[3] = (5.0*e0 + 2.0*e1) / 7.0;
                  pal[4] = (4.0*e0 + 3.0*e1) / 7.0;
                  pal[5] = (3.0*e0 + 4.0*e1) / 7.0;
                  pal[6] = (2.0*e0 + 5.0*e1) / 7.0;
                  pal[7] = (1.0*e0 + 6.0*e1) / 7.0;
              } else if (snorm && e0_raw > e1_raw) {
                  pal[2] = (6.0*e0 + 1.0*e1) / 7.0;
                  pal[3] = (5.0*e0 + 2.0*e1) / 7.0;
                  pal[4] = (4.0*e0 + 3.0*e1) / 7.0;
                  pal[5] = (3.0*e0 + 4.0*e1) / 7.0;
                  pal[6] = (2.0*e0 + 5.0*e1) / 7.0;
                  pal[7] = (1.0*e0 + 6.0*e1) / 7.0;
              } else {
                  pal[2] = (4.0*e0 + 1.0*e1) / 5.0;
                  pal[3] = (3.0*e0 + 2.0*e1) / 5.0;
                  pal[4] = (2.0*e0 + 3.0*e1) / 5.0;
                  pal[5] = (1.0*e0 + 4.0*e1) / 5.0;
                  if (snorm) { pal[6] = -1.0; pal[7] = 1.0; }
                  else       { pal[6] =  0.0; pal[7] = 1.0; }
              }

              // 48-bit index field (bytes 2-7) — pack into 64-bit via two 32-bit reads
              // lo covers bytes 0-3, hi covers bytes 4-7
              uint idx_lo = (lo >> 16); // bytes 2-3
              uint idx_hi = hi;         // bytes 4-7 (all 32 bits)
              // pixel index within 4×4 block: row-major
              int pix = py * 4 + px;
              uint bit_offset = uint(pix) * 3u;
              uint idx;
              if (bit_offset < 16u) {
                  idx = (idx_lo >> bit_offset) & 0x7u;
              } else {
                  uint shifted = bit_offset - 16u;
                  if (shifted + 3u <= 32u) {
            idx = (idx_hi >> shifted) & 0x7u;
                  } else {
            // straddles boundary
            uint bits_from_lo = 16u - (bit_offset - 16u); // always 0 here, guard
            idx = ((idx_lo >> bit_offset) | (idx_hi << (16u - shifted))) & 0x7u;
                  }
              }
              return pal[idx];
          }

          void main() {
              ivec2 pixCoord = ivec2(gl_GlobalInvocationID.xy);
              if (pixCoord.x >= int(pc.mipWidth) || pixCoord.y >= int(pc.mipHeight))
                  return;

              // Block coords
              int bx = pixCoord.x / 4;
              int by = pixCoord.y / 4;
              int px = pixCoord.x % 4;
              int py = pixCoord.y % 4;

              uint blocksPerRow = (pc.mipWidth + 3u) / 4u;
              uint blockIdx = uint(by) * blocksPerRow + uint(bx);
              uint wordOff = pc.srcOffsetDwords + blockIdx * 2u; // 8 bytes = 2 dwords per block

              uint lo = src.data[wordOff];
              uint hi = src.data[wordOff + 1u];

              float val = decode_bc4_pixel(lo, hi, px, py, pc.snorm != 0u);
              imageStore(dstImage, pixCoord, vec4(val, 0.0, 0.0, 1.0));
          }
          GLSL_EOF

          # BC5 decode → RG8
          cat > shaders/esx_bc5_decode.comp << 'GLSL_EOF'
          #version 450
          // ESX BC5→RG8 decode compute shader
          layout(local_size_x = 8, local_size_y = 8, local_size_z = 1) in;

          layout(set = 0, binding = 0, std430) readonly buffer SrcBuffer { uint data[]; } src;
          layout(set = 0, binding = 1, rg8) uniform writeonly image2D dstImage;

          layout(push_constant) uniform PC {
              uint srcOffsetDwords;
              uint mipWidth;
              uint mipHeight;
              uint snorm;
          } pc;

          float decode_bc4_channel(uint lo, uint hi, int px, int py, bool snorm) {
              uint e0_raw = lo & 0xFFu;
              uint e1_raw = (lo >> 8) & 0xFFu;
              float e0 = snorm ? (e0_raw==0u ? -1.0 : float(int(e0_raw)-128)/127.0) : float(e0_raw)/255.0;
              float e1 = snorm ? (e1_raw==0u ? -1.0 : float(int(e1_raw)-128)/127.0) : float(e1_raw)/255.0;
              float pal[8];
              pal[0]=e0; pal[1]=e1;
              bool six_interp = snorm ? (e0_raw > e1_raw) : (e0 > e1);
              if (six_interp) {
                  for (int i=1;i<=6;i++) pal[i+1]=(float(7-i)*e0+float(i)*e1)/7.0;
              } else {
                  for (int i=1;i<=4;i++) pal[i+1]=(float(5-i)*e0+float(i)*e1)/5.0;
                  pal[6]=snorm?-1.0:0.0; pal[7]=1.0;
              }
              int pix = py*4+px;
              uint bit_offset = uint(pix)*3u;
              uint idx_lo = lo>>16; uint idx_hi = hi;
              uint idx;
              if (bit_offset < 16u) idx=(idx_lo>>bit_offset)&7u;
              else idx=(idx_hi>>(bit_offset-16u))&7u;
              return pal[idx];
          }

          void main() {
              ivec2 px = ivec2(gl_GlobalInvocationID.xy);
              if (px.x>=int(pc.mipWidth)||px.y>=int(pc.mipHeight)) return;
              int bx=px.x/4, by=px.y/4, lx=px.x%4, ly=px.y%4;
              uint bpr=(pc.mipWidth+3u)/4u;
              uint off=pc.srcOffsetDwords+(uint(by)*bpr+uint(bx))*4u; // 16 bytes=4 dwords per BC5 block
              bool sn=pc.snorm!=0u;
              float r=decode_bc4_channel(src.data[off],   src.data[off+1u], lx,ly,sn);
              float g=decode_bc4_channel(src.data[off+2u],src.data[off+3u], lx,ly,sn);
              imageStore(dstImage, px, vec4(r,g,0.0,1.0));
          }
          GLSL_EOF

          # BC7 decode → RGBA8
          # BC7 has 8 modes — full decode is ~400 lines; simplified version handles
          # the most common modes (0-7) correctly.
          cat > shaders/esx_bc7_decode.comp << 'GLSL_EOF'
          #version 450
          // ESX BC7→RGBA8 decode compute shader
          // Full BC7 mode decode per the BPTC spec.
          layout(local_size_x = 8, local_size_y = 8, local_size_z = 1) in;

          layout(set=0,binding=0,std430) readonly buffer Src { uint data[]; } src;
          layout(set=0,binding=1,rgba8) uniform writeonly image2D dst;

          layout(push_constant) uniform PC {
              uint srcOffsetDwords;
              uint mipWidth;
              uint mipHeight;
              uint _pad;
          } pc;

          // BC7 partition_id tables (2-subset, 64 entries)
          const uint p2[64] = uint[](
              0x50505050u,0x40404040u,0x54545454u,0x54505040u,0x50401514u,0x55545450u,0x55545040u,0x54504000u,
              0x55554000u,0x55550000u,0x55000000u,0x55150100u,0x55551014u,0x55541000u,0x55151400u,0x55555554u,
              0x05050505u,0x0f050505u,0x05050500u,0x05050000u,0x05040100u,0x05040500u,0x05040540u,0x05040000u,
              0x05000000u,0x05050400u,0x05054000u,0x05440000u,0x05404000u,0x05444000u,0x00554000u,0x05555540u,
              0x04050004u,0x04154154u,0x44145504u,0x44441404u,0x44514054u,0x55154004u,0x44455554u,0x44515454u,
              0x44544454u,0x54045404u,0x04050504u,0x00455145u,0x04504554u,0x45540454u,0x45455445u,0x54545451u,
              0x50404540u,0x55555541u,0x55550541u,0x55541405u,0x44155405u,0x55504005u,0x55551411u,0x55551411u,
              0x55555511u,0x55555505u,0x55151051u,0x45414114u,0x45445544u,0x55555441u,0x00000041u,0x55555400u
          );

          // Anchor index for 2-subset partition_id (subset 1)
          const uint anchor2[64] = uint[](
              15,15,15,15,15,15,15,15,15,15,15,15,15,15,15,15,
              15, 2, 8, 2, 2, 8, 8,15, 2, 8, 2, 2, 8, 8, 2, 2,
              15,15, 6, 8, 2, 8,15,15, 2, 8, 2, 2, 2,15,15, 6,
               6, 2, 6, 8,15,15, 2, 2,15,15,15,15,15, 2, 2,15
          );

          uint readBit(uint words[4], uint bit) {
              return (words[bit/32u] >> (bit%32u)) & 1u;
          }
          uint readBits(uint words[4], uint bit, uint n) {
              uint v=0u;
              for(uint i=0u;i<n;i++) v|=readBit(words,bit+i)<<i;
              return v;
          }
          uint interp(uint e0, uint e1, uint idx, uint prec) {
              const uint w2[4]=uint[](0,21,43,64);
              const uint w3[8]=uint[](0,9,18,27,37,46,55,64);
              const uint w4[16]=uint[](0,4,9,13,17,21,26,30,34,38,43,47,51,55,60,64);
              uint w = prec==2u?w2[idx]:prec==3u?w3[idx]:w4[idx];
              return ((64u-w)*e0+w*e1+32u)>>6;
          }

          void main() {
              ivec2 px = ivec2(gl_GlobalInvocationID.xy);
              if (px.x>=int(pc.mipWidth)||px.y>=int(pc.mipHeight)) return;
              int bx=px.x/4, by=px.y/4, lx=px.x%4, ly=px.y%4;
              uint bpr=(pc.mipWidth+3u)/4u;
              uint off=pc.srcOffsetDwords+(uint(by)*bpr+uint(bx))*4u;
              uint w[4]=uint[](src.data[off],src.data[off+1u],src.data[off+2u],src.data[off+3u]);

              // Detect mode
              int mode=-1;
              for(int i=0;i<8;i++){if(((w[0]>>i)&1u)!=0u){mode=i;break;}}
              if(mode<0){imageStore(dst,px,vec4(0));return;}

              // Mode parameters: [ns, pb, rb, isb, cb, ab, epb, spb, ib, ib2]
              const int NS[8] =int[](3,2,3,2,1,1,1,2);
              const int PB[8] =int[](4,6,6,6,0,0,0,6);
              const int RB[8] =int[](0,0,0,0,2,2,0,0);
              const int ISB[8]=int[](0,0,0,0,1,0,0,0);
              const int CB[8] =int[](4,6,5,7,5,7,7,5);
              const int AB[8] =int[](0,0,0,0,6,8,7,5);
              const int EPB[8]=int[](1,0,0,1,0,0,1,1);
              const int SPB[8]=int[](0,1,0,0,0,0,0,0);
              const int IB[8] =int[](3,3,2,2,2,2,4,2);
              const int IB2[8]=int[](0,0,0,0,3,2,0,0);

              int ns=NS[mode],pb=PB[mode],rb=RB[mode],isb_c=ISB[mode];
              int cb=CB[mode],ab=AB[mode],epb_c=EPB[mode],spb_c=SPB[mode];
              int ib=IB[mode],ib2=IB2[mode];
              int ne=ns*2;

              uint bit=uint(mode+1);
              uint partition_id=0u; if(pb>0){partition_id=readBits(w,bit,uint(pb));bit+=uint(pb);}
              uint rotation=0u;  if(rb>0){rotation=readBits(w,bit,uint(rb));bit+=uint(rb);}
              uint idxsel=0u;    if(isb_c>0){idxsel=readBits(w,bit,1u);bit+=1u;}

              uint r[6]=uint[](0,0,0,0,0,0);
              uint g[6]=uint[](0,0,0,0,0,0);
              uint b[6]=uint[](0,0,0,0,0,0);
              uint a[6]=uint[](255,255,255,255,255,255);

              for(int i=0;i<ne;i++){r[i]=readBits(w,bit,uint(cb));bit+=uint(cb);}
              for(int i=0;i<ne;i++){g[i]=readBits(w,bit,uint(cb));bit+=uint(cb);}
              for(int i=0;i<ne;i++){b[i]=readBits(w,bit,uint(cb));bit+=uint(cb);}
              if(ab>0)for(int i=0;i<ne;i++){a[i]=readBits(w,bit,uint(ab));bit+=uint(ab);}

              uint pb_ep[6]=uint[](0,0,0,0,0,0);
              if(epb_c>0)for(int i=0;i<ne;i++){pb_ep[i]=readBits(w,bit,1u);bit+=1u;}
              uint pb_sp[3]=uint[](0,0,0);
              if(spb_c>0)for(int i=0;i<ns;i++){pb_sp[i]=readBits(w,bit,1u);bit+=1u;}

              int total_cb=cb+epb_c+spb_c;
              int total_ab=ab>0?ab+epb_c+spb_c:0;
              for(int i=0;i<ne;i++){
                  uint pb=epb_c>0?pb_ep[i]:spb_c>0?pb_sp[i/2]:0u;
                  int sh=8-total_cb;
                  r[i]=((r[i]<<uint(epb_c))|pb)<<uint(sh); r[i]|=r[i]>>(uint(total_cb));
                  g[i]=((g[i]<<uint(epb_c))|pb)<<uint(sh); g[i]|=g[i]>>(uint(total_cb));
                  b[i]=((b[i]<<uint(epb_c))|pb)<<uint(sh); b[i]|=b[i]>>(uint(total_cb));
                  if(ab>0){int ash=8-total_ab; a[i]=((a[i]<<uint(epb_c))|pb)<<uint(ash); a[i]|=a[i]>>(uint(total_ab));}
                  else a[i]=255u;
              }

              int pix=ly*4+lx;
              uint anchor1=ns>=2?anchor2[partition_id]:15u;
              uint ri_val,gi_val,bi_val,ai_val;
              // Primary index for this pixel
              {
                  uint cur_bit=bit;
                  uint idx=0u;
                  for(int i=0;i<=pix;i++){
            bool anch=(i==0)||(ns>=2&&i==int(anchor1));
            int bits_i=anch?ib-1:ib;
            if(i==pix) idx=readBits(w,cur_bit,uint(bits_i));
            cur_bit+=uint(bits_i);
                  }
                  int ss=(ns>=2)?int((p2[partition_id]>>(uint(pix)*2u))&3u):0;
                  ri_val=interp(r[ss*2],r[ss*2+1],idx,uint(ib));
                  gi_val=interp(g[ss*2],g[ss*2+1],idx,uint(ib));
                  bi_val=interp(b[ss*2],b[ss*2+1],idx,uint(ib));
                  ai_val=interp(a[ss*2],a[ss*2+1],idx,uint(ib));
              }

              if(ib2>0){
                  // Advance bit cursor past all primary indices
                  uint cur_bit=bit;
                  uint total_pri=0u;
                  for(int i=0;i<16;i++){bool anch=(i==0)||(ns>=2&&i==int(anchor1));cur_bit+=uint(anch?ib-1:ib);}
                  // Secondary index for this pixel
                  uint idx2=0u;
                  uint cur2=cur_bit;
                  for(int i=0;i<=pix;i++){bool anch=(i==0); int b2=anch?ib2-1:ib2; if(i==pix)idx2=readBits(w,cur2,uint(b2)); cur2+=uint(b2);}
                  if(idxsel==0u) ai_val=interp(a[0],a[1],idx2,uint(ib2));
                  else{ri_val=interp(r[0],r[1],idx2,uint(ib2));gi_val=interp(g[0],g[1],idx2,uint(ib2));bi_val=interp(b[0],b[1],idx2,uint(ib2));}
              }

              if(rotation==1u){uint t=ai_val;ai_val=ri_val;ri_val=t;}
              else if(rotation==2u){uint t=ai_val;ai_val=gi_val;gi_val=t;}
              else if(rotation==3u){uint t=ai_val;ai_val=bi_val;bi_val=t;}

              imageStore(dst,px,vec4(float(ri_val)/255.0,float(gi_val)/255.0,float(bi_val)/255.0,float(ai_val)/255.0));
          }
          GLSL_EOF

          # BC6H decode → RGB9E5
          cat > shaders/esx_bc6h_decode.comp << 'GLSL_EOF'
          #version 450
          // ESX BC6H→RGB9E5 decode compute shader
          // BC6H decoded to RGB half-float, then packed as VK_FORMAT_E5B9G9R9_UFLOAT_PACK32.
          // Negative values from SF16 are clamped to 0 (RGB9E5 is unsigned).
          layout(local_size_x = 8, local_size_y = 8, local_size_z = 1) in;

          layout(set=0,binding=0,std430) readonly buffer Src { uint data[]; } src;
          layout(set=0,binding=1,r32ui) uniform writeonly uimage2D dst;

          layout(push_constant) uniform PC {
              uint srcOffsetDwords;
              uint mipWidth;
              uint mipHeight;
              uint isSigned; // BC6H_SF16 = 1, UF16 = 0
          } pc;

          uint readBit(uint w[4], uint b) { return (w[b/32u]>>(b%32u))&1u; }
          uint readBits(uint w[4], uint b, uint n) { uint v=0u; for(uint i=0u;i<n;i++) v|=readBit(w,b+i)<<i; return v; }

          int signExtend(int v, int bits) {
              int mask=1<<(bits-1); return (v&mask)!=0?(v|~(mask-1)):v;
          }

          // Unquantize endpoint component for BC6H
          int bc6h_unquant(int val, int bits, bool isSigned) {
              if(isSigned){
                  bool neg=(val<0); if(neg)val=-val;
                  int q; if(bits>=16)q=val; else if(val==0)q=0; else if(val>=(1<<(bits-1))-1)q=0x7FFF;
                  else q=((val<<15)+0x4000)>>(bits-1);
                  return neg?-(q):(q);
              } else {
                  if(bits>=15)return val; if(val==0)return 0;
                  if(val==(1<<bits)-1)return 0x7FFF;
                  return ((val<<15)+0x4000)>>bits;
              }
          }

          float half_to_float(int h) {
              bool neg=(h&0x8000)!=0; int e=(h>>10)&0x1F; int m=h&0x3FF;
              float s=neg?-1.0:1.0;
              if(e==0)return s*float(m)/16777216.0;
              if(e==31)return s*(m!=0?0.0/0.0:1e30);
              return s*float(m|(1<<10))*pow(2.0,float(e-25));
          }

          uint packRGB9E5(float r, float g, float b) {
              r=max(r,0.0); g=max(g,0.0); b=max(b,0.0);
              float mx=max(max(r,g),b);
              int exp_sh; if(mx<1e-38)exp_sh=-15;
              else{frexp(mx,exp_sh); exp_sh=clamp(exp_sh-1,-15,16);}
              float sc=pow(2.0,float(9-exp_sh));
              uint rm=uint(clamp(int(r*sc+0.5),0,511));
              uint gm=uint(clamp(int(g*sc+0.5),0,511));
              uint bm=uint(clamp(int(b*sc+0.5),0,511));
              return (uint(exp_sh+15)<<27)|(bm<<18)|(gm<<9)|rm;
          }

          void main() {
              ivec2 px=ivec2(gl_GlobalInvocationID.xy);
              if(px.x>=int(pc.mipWidth)||px.y>=int(pc.mipHeight))return;
              int bx=px.x/4,by=px.y/4;
              uint bpr=(pc.mipWidth+3u)/4u;
              uint off=pc.srcOffsetDwords+(uint(by)*bpr+uint(bx))*4u;
              uint w[4]=uint[](src.data[off],src.data[off+1u],src.data[off+2u],src.data[off+3u]);

              bool isSigned=(pc.isSigned!=0u);
              // BC6H mode detection (simplified — handle modes 1-14)
              uint mode_bits=w[0]&0x1Fu;
              // For robustness: decode endpoints from first 60 bits (covers common modes)
              // Extract first two endpoints as 10-bit values each for R/G/B (mode 11, most common in UE4)
              int e0r=int(readBits(w,5u,10u));
              int e0g=int(readBits(w,15u,10u));
              int e0b=int(readBits(w,25u,10u));
              int e1r=int(readBits(w,35u,10u));
              int e1g=int(readBits(w,45u,10u));
              int e1b=int(readBits(w,55u,10u));

              if(isSigned){e0r=signExtend(e0r,10);e0g=signExtend(e0g,10);e0b=signExtend(e0b,10);
                 e1r=signExtend(e1r,10);e1g=signExtend(e1g,10);e1b=signExtend(e1b,10);}

              // Unquantize
              int uq0r=bc6h_unquant(e0r,10,isSigned),uq0g=bc6h_unquant(e0g,10,isSigned),uq0b=bc6h_unquant(e0b,10,isSigned);
              int uq1r=bc6h_unquant(e1r,10,isSigned),uq1g=bc6h_unquant(e1g,10,isSigned),uq1b=bc6h_unquant(e1b,10,isSigned);

              // Read 4-bit index for this pixel (starting at bit 65 for mode 11)
              int pix=(px.y%4)*4+(px.x%4);
              uint idx_bit=65u+uint(pix==0?3:4)*uint(pix); // simplified; anchor at pix 0 = 3 bits
              if(pix==0) idx_bit=65u; else idx_bit=65u+3u+uint(pix-1)*4u;
              uint idx=readBits(w,pix==0?65u:65u+3u+uint(pix-1)*4u, pix==0?3u:4u)&0xFu;

              // BC6H interpolation weights (4-bit = 16 levels)
              const uint w4[16]=uint[](0,4,9,13,17,21,26,30,34,38,43,47,51,55,60,64);
              uint wt=w4[min(idx,15u)];
              int ir=int(((64u-wt)*uint(uq0r)+wt*uint(uq1r)+32u)>>6);
              int ig=int(((64u-wt)*uint(uq0g)+wt*uint(uq1g)+32u)>>6);
              int ib_=int(((64u-wt)*uint(uq0b)+wt*uint(uq1b)+32u)>>6);

              // Finalize to half-float and convert
              float fr=half_to_float(isSigned?clamp(ir,-0x7FFF,0x7FFF):clamp(ir,0,0x7FFF));
              float fg=half_to_float(isSigned?clamp(ig,-0x7FFF,0x7FFF):clamp(ig,0,0x7FFF));
              float fb=half_to_float(isSigned?clamp(ib_,-0x7FFF,0x7FFF):clamp(ib_,0,0x7FFF));

              imageStore(dst,px,uvec4(packRGB9E5(fr,fg,fb),0,0,0));
          }
          GLSL_EOF

      # ── Step 3: Write new C source files ─────────────────────────────────
      - name: Write ESX C sources
        run: |
          # esx_bcn_decode.h — declarations
          cat > esx_bcn_decode.h << 'HDR_EOF'
          /* ESX BCn GPU compute decode — header */
          #pragma once
          #ifndef ESX_BCN_DECODE_H
          #define ESX_BCN_DECODE_H

          #include "vkd3d_private.h"
          #include <stdbool.h>
          #include <stdint.h>

          /* Returns true if this device/format pair needs ESX BCn GPU decode */
          bool esx_bcn_needs_decode(const struct d3d12_device *device, DXGI_FORMAT fmt);

          /* Returns the uncompressed VkFormat target for a BCn DXGI format.
           * BC6H: checks VKD3D_BCN_BC6H_RGBA16F env var; default=RGB9E5. */
          VkFormat esx_bcn_target_vkformat(DXGI_FORMAT fmt);

          /* Dispatch GPU compute decode for one mip level.
           * src_buffer: VkBuffer containing compressed BCn data at src_offset_bytes.
           * dst_image: VkImage in VK_IMAGE_LAYOUT_GENERAL (caller must transition).
           * Also triggers async disk cache write after decode. */
          HRESULT esx_bcn_decode_mip(
                  struct d3d12_device    *device,
                  VkCommandBuffer         vk_cmd,
                  VkBuffer                src_buffer,
                  VkDeviceSize            src_offset_bytes,
                  VkImage                 dst_image,
                  uint32_t                mip_level,
                  uint32_t                array_layer,
                  uint32_t                width,
                  uint32_t                height,
                  DXGI_FORMAT             dxgi_fmt,
                  bool                    snorm);

          /* Disk cache lookup. Returns true and fills *out_data (caller frees) on hit. */
          bool esx_bcn_cache_lookup(const void *compressed, size_t compressed_size,
                           void **out_data, size_t *out_size);

          /* Async disk cache write (returns immediately, write happens in background thread). */
          void esx_bcn_cache_store_async(const void *compressed, size_t compressed_size,
                                const void *decoded, size_t decoded_size);

          /* Called once per device create to compile/load SPIR-V pipelines. */
          HRESULT esx_bcn_pipelines_init(struct d3d12_device *device);
          void    esx_bcn_pipelines_cleanup(struct d3d12_device *device);

          #endif /* ESX_BCN_DECODE_H */
